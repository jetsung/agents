# yaml-language-server: $schema=config.schema.json
env:
  HELLO: WORLD

# 工具平台配置
# path: 工具配置目录（支持 ~ 展开；./ 前缀表示相对项目目录，如 ./.pi）
# agents: agents 配置文件名（相对于 path），为空则不安装
# source: agents 源文件名，默认为 AGENTS.md
# ensure_dir: 目标目录不存在时自动创建（可选，默认 false 跳过）
#
# 注意：全部已确认渠道均已内置至 agents.py（BUILTIN_PLATFORMS），
# 此处配置用于覆盖同名内置渠道；未在此配置的渠道来自内置表或
# ~/.xskill/settings.json 补充。删除某渠道不会停用内置同名渠道，
# 如需停用请同步修改 agents.py 的 BUILTIN_PLATFORMS。
# platforms:
  # pi 渠道已内置至 agents.py（BUILTIN_PLATFORMS），此处配置用于覆盖内置同名渠道。
  # 如需调整，可在下方以同名 key 覆盖，例如：
  # pi:
  #   path: ~/.pi/agent
  #   agents: AGENTS.md
  #   ensure_dir: true

# 工具安装配置
# 每个 tool 条目支持以下字段:
#   id:   工具唯一标识（必填）
#   name: 显示名称（可选，默认同 id）
#   env:  该工具专属环境变量（与全局 env 合并，支持 $ENV_VAR 替换）
#   type: 资源类型（可选，默认 tool），取值:
#         - skill: 作为 skill 解压到项目内 skills/ 目录
#         - tool:  作为普通工具安装（默认）
#   steps: 步骤列表（必填，跨平台，详见下方命令说明）。
#         每个步骤可含可选 name 字段，用于说明该步骤。
#         支持 run 步骤类型（见下），不再使用顶层 run 字段。
#
# steps 支持的命令（每个步骤可加 name: 说明）:
#   - name: 步骤说明（可选）
#     action: download —— 下载文件，保存到 .tmp/<id>/
#     - source: URL（支持 $ENV_VAR 替换）
#     - target: 自定义文件名（缺省从 URL 路径提取，剥离 query），
#       归档名自动导出为 $AGENTS_ARCHIVE 供后续 extract/run 引用
#     action: extract —— 解压归档（source 为包名，省略时自动使用最近一次
#       download 的归档名，在 .tmp/<id>/ 查找；
#       target 缺省按 type：skill → skills/<id>/，mcp → mcp/<id>/
#       target 已存在先移除；包内唯一顶层目录自动上提）
#     其他 action 见 config.schema.json（download/extract/mv/cp/rm/mkdir/test/shell）
#
#     action 与 run 互斥：
#     - 无 action（默认 shell）→ 必须提供 run 字段执行脚本
#     - action: shell → 同样使用 run 字段（run 必填）
#     - action 为其他内置命令 → 忽略 run 字段（即使存在）
#   - name: 步骤说明（可选）
#     run: shell 命令行字符串（类似 GitHub Actions run:），直接执行。
#          工作目录按 type 决定：skill → skills/，mcp → mcp/，
#          其他 → .tmp（可用 $AGENTS_RUN_DIR 引用）
#
# type 支持的值: skill | tool（默认）| mcp | custom
#   - skill: 作为 skill 解压到项目内 skills/ 目录
#   - tool:  普通工具
#   - mcp:   MCP 服务
#   - custom: 自定义类型，不支持解压，后续工作直接通过 run 步骤执行
tools:
  # https://codearts.huaweicloud.com/download.html#section-8
  - id: codearts
    name: CodeArts Check MCP
    type: mcp
    doc: https://codearts.huaweicloud.com/download.html#section-8
    env:
      URL: https://codeheck-chajian-bj4-obs.obs.cn-north-4.myhuaweicloud.com/mcp/codeartscheck/1.0.0/CodeArtsCheckMCP-1.0.0.tgz
    steps:
      - name: 下载 CodeArts Check MCP
        action: download
        source: $URL
      - name: 解压到 mcp/codearts（包内 package/ 顶层目录自动上提）
        action: extract
        source: CodeArtsCheckMCP-1.0.0.tgz
      - name: 打印配置文件
        run: |
          echo "MCP 配置:"
          printf '{"mcpServers":{"CodeArts Check MCP":{"disabled":false,"timeout":600000,"command":["node","%s/dist/index.js"],"environment":{"region":"cn-north-4","ak":"your_ak","sk":"your_sk"},"type":"local"}}}' "$AGENTS_TOOL_DIR" | jq -r

  # skills：下载 Skill 技能包，type=skill 时 extract 默认解压到 skills/ 文件夹
  # weiyun zip 内含 weiyun/ 顶层目录，解压到 skills/ 即得到 skills/weiyun/
  # https://www.weiyun.com/act/skill
  - id: weiyun
    name: 微云网盘技能
    type: skill
    doc: https://www.weiyun.com/act/skill
    env:
      URL: https://cdn.addon.tencentsuite.com/static/tencent-weiyun.zip
    steps:
      - name: 下载微云网盘技能
        action: download
        source: $URL
      # 解压到 skills/weiyun：包内 weiyun/ 顶层目录会被自动上提，
      # 无论 zip 是否含顶层目录，最终都直接落在 skills/weiyun/
      - name: 解压到 skills/weiyun
        action: extract
        source: tencent-weiyun.zip

  # https://semi.design/zh-CN/start/mcp-skills#%E5%AE%89%E8%A3%85%20Skills
  - id: semi-design-guide
    name: Semi Design 使用指南
    type: skill
    doc: https://semi.design/zh-CN/start/mcp-skills#%E5%AE%89%E8%A3%85%20Skills
    env:
      URL: https://semi.design/skills.zip
    steps:
      - name: 下载 Semi Design 使用指南
        action: download
        source: $URL
      # 解压到 skills/semi-ui-skills：包内顶层目录自动上提
      - name: 解压到 skills/semi-ui-skills
        action: extract
        source: skills.zip

  # https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
  - id: ui-ux-pro-max-skill
    name: UI UX Pro Max
    type: tool
    doc: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
    steps:
      - name: 安装 UI UX Pro Max
        run: |
          npm install -g ui-ux-pro-max-cli
      - name: 验证 UI UX Pro Max 安装状态
        run: |
          uipro --version

  # https://github.com/github/spec-kit.git
  - id: spec-kit
    name: GitHub Spec Kit
    type: tool
    doc: https://github.com/github/spec-kit.git
    steps:
      - name: 安装 GitHub Spec Kit
        run: |
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git
      - name: 验证 GitHub Spec Kit 安装状态
        run: |
          specify --version

  - id: qoder
    name: Qoder CLI
    type: tool
    doc: https://qoder.com/zh/cli
    steps:
      - name: 安装 Qoder CLI
        run: |
          curl -fsSL https://qoder.com/install | bash
      - name: 验证 Qoder CLI 安装状态
        run: |
          qodercli --version

  - id: qoder-cn
    name: Qoder CLI（国内版）
    type: tool
    doc: https://qoder.cn/cli
    steps:
      - name: 安装 Qoder CLI（国内版）
        run: |
          curl -fsSL https://qoder.com.cn/install | bash
      - name: 验证 Qoder CLI 安装状态
        run: |
          qoderclicn --version

  - id: atomcode
    name: AtomCode CLI
    type: tool
    doc: https://atomcode.atomgit.com/
    steps:
      - name: 安装 AtomCode CLI
        run: |
          curl -fsSL https://raw.atomgit.com/atomgit_atomcode/atomcode/raw/main/scripts/install.sh | sh
      - name: 验证 AtomCode CLI 安装状态
        run: |
          atomcode --version

  # skills 示例：action 与 run 步骤组合
  # - id: example-skill
  #   name: 示例 Skill
  #   type: skill
  #   doc: Docs URL
  #   steps:
  #     - name: 准备安装
  #       run: echo "准备安装示例 skill..."
  #     - name: 下载并解压
  #       action: download
  #       source: https://example.com/skill.zip
